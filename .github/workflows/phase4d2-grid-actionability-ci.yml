name: Phase 4D.2 Pionex Grid Activity & Actionability CI

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: phase4d2-pionex-grid-actionability
  cancel-in-progress: false

jobs:
  grid-actionability:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Refresh Phase 4D research geometry at promoted execution resolution
        run: |
          python scripts/build_pionex_grid_geometry_optimizer_v2.py
          test -s data/diagnostics/pionex_grid_geometry_optimizer_v1.json
          test -s data/diagnostics/pionex_grid_calibration_v2.json
          test -s data/pionex/grid_geometry_recommendations_v1.csv

      - name: Validate Phase 4D execution integration
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          geo = json.loads(Path("data/diagnostics/pionex_grid_geometry_optimizer_v1.json").read_text(encoding="utf-8"))
          policy = json.loads(Path("data/pionex/execution_resolution_policy_v1.json").read_text(encoding="utf-8"))
          integration = geo.get("execution_resolution_integration") or {}

          expected = str(policy.get("active_execution_resolution") or "1hour")
          actual = str(integration.get("execution_replay_resolution") or "")

          if integration.get("execution_resolution_integrated") is not True:
              raise SystemExit(f"Phase 4D execution integration missing: {integration}")
          if actual != expected:
              raise SystemExit(f"Phase 4D replay resolution {actual} != Phase 4D.1 policy {expected}")
          if expected == "5min" and policy.get("status") != "PROMOTION_READY":
              raise SystemExit(f"5min used without PROMOTION_READY policy: {policy}")

          hist = integration.get("historical_5m_replay") or {}
          if expected == "5min" and int(hist.get("paths_built") or 0) < 24:
              raise SystemExit(f"Insufficient 5m analogue coverage: {hist}")

          print("Phase 4D execution integration passed:", integration)
          PY

      - name: Build Phase 4D.2 activity and actionability
        run: |
          python scripts/build_pionex_grid_activity_v1.py
          test -s data/diagnostics/pionex_grid_actionability_v1.json
          test -s data/pionex/grid_activity_windows_v1.csv

      - name: Validate Phase 4D.2 outputs
        run: |
          python - <<'PY'
          import csv
          import json
          from pathlib import Path

          diag = json.loads(Path("data/diagnostics/pionex_grid_actionability_v1.json").read_text(encoding="utf-8"))
          if diag.get("schema") != "pionex_grid_actionability_v1":
              raise SystemExit(f"Unexpected schema: {diag.get('schema')}")

          latest = diag.get("latest_observed_state") or {}
          if latest.get("observed_quantity_per_grid_eth") is None:
              raise SystemExit("Observed live quantity/grid missing")

          audit = diag.get("current_benchmark_quantity_audit") or {}
          if audit.get("observed_live_quantity_per_grid_eth") is None:
              raise SystemExit("Current quantity audit missing observed value")

          gates = diag.get("prospective_gates") or {}
          exec_gate = gates.get("execution_resolution") or {}
          integration_gate = gates.get("geometry_execution_integration") or {}
          if exec_gate.get("passed") is True and integration_gate.get("passed") is not True:
              raise SystemExit(f"Execution policy passed but geometry integration did not: {integration_gate}")

          op = diag.get("operational_decision") or {}
          if op.get("action") is None:
              raise SystemExit("Operational decision missing")

          with Path("data/pionex/grid_activity_windows_v1.csv").open("r", encoding="utf-8", newline="") as f:
              rows = list(csv.DictReader(f))
          if len(rows) < 3:
              raise SystemExit(f"Expected at least 3 observed activity windows, found {len(rows)}")

          practical = ((diag.get("research_geometry") or {}).get("literal_practical_rounding") or {})
          if practical:
              for key in ("lower_usdt", "upper_usdt"):
                  value = float(practical[key])
                  if abs(value / 5.0 - round(value / 5.0)) > 1e-9:
                      raise SystemExit(f"Practical bound is not literal $5 rounding: {key}={value}")

          print("Phase 4D.2 validation passed.")
          print("Latest:", latest)
          print("Latest activity:", diag.get("latest_observed_activity_window"))
          print("Gates:", gates)
          print("Operational:", op)
          PY

      - name: Upload Phase 4D.2 diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: pionex-grid-actionability-v1
          path: |
            data/diagnostics/pionex_grid_actionability_v1.json
            data/diagnostics/pionex_grid_geometry_optimizer_v1.json
            data/diagnostics/pionex_grid_calibration_v2.json
            data/pionex/grid_activity_windows_v1.csv
            data/pionex/grid_geometry_recommendations_v1.csv
          if-no-files-found: error

      - name: Persist Phase 4D.2 outputs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add \
            data/diagnostics/pionex_grid_actionability_v1.json \
            data/diagnostics/pionex_grid_geometry_optimizer_v1.json \
            data/diagnostics/pionex_grid_calibration_v2.json \
            data/pionex/grid_activity_windows_v1.csv \
            data/pionex/grid_geometry_recommendations_v1.csv

          if ! git diff --quiet; then
            echo "Unexpected unstaged tracked changes remain after staging expected outputs:"
            git status --short
            exit 1
          fi

          git diff --cached --quiet && echo "No Phase 4D.2 output changes" && exit 0
          git commit -m "Phase 4D.2 grid activity and actionability [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
