name: Phase 4D.2 Pionex Grid Activity & Actionability CI

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: phase4d2-pionex-grid-actionability
  cancel-in-progress: false

jobs:
  grid-actionability:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh Phase 4D research geometry
        run: |
          python scripts/build_pionex_grid_geometry_optimizer_v1.py
          test -s data/diagnostics/pionex_grid_geometry_optimizer_v1.json
          test -s data/diagnostics/pionex_grid_calibration_v2.json

      - name: Build Phase 4D.2 activity and actionability
        run: |
          python scripts/build_pionex_grid_activity_v1.py
          test -s data/diagnostics/pionex_grid_actionability_v1.json
          test -s data/pionex/grid_activity_windows_v1.csv

      - name: Validate Phase 4D.2 outputs
        run: |
          python - <<'PY'
          import csv
          import json
          from pathlib import Path

          diag = json.loads(Path("data/diagnostics/pionex_grid_actionability_v1.json").read_text(encoding="utf-8"))
          if diag.get("schema") != "pionex_grid_actionability_v1":
              raise SystemExit(f"Unexpected schema: {diag.get('schema')}")

          latest = diag.get("latest_observed_state") or {}
          if latest.get("observed_quantity_per_grid_eth") is None:
              raise SystemExit("Observed live quantity/grid missing")

          audit = diag.get("current_benchmark_quantity_audit") or {}
          if audit.get("observed_live_quantity_per_grid_eth") is None:
              raise SystemExit("Current quantity audit missing observed value")

          op = diag.get("operational_decision") or {}
          if op.get("action") is None:
              raise SystemExit("Operational decision missing")

          with Path("data/pionex/grid_activity_windows_v1.csv").open("r", encoding="utf-8", newline="") as f:
              rows = list(csv.DictReader(f))
          if len(rows) < 3:
              raise SystemExit(f"Expected at least 3 observed activity windows, found {len(rows)}")

          practical = ((diag.get("research_geometry") or {}).get("literal_practical_rounding") or {})
          if practical:
              for key in ("lower_usdt", "upper_usdt"):
                  value = float(practical[key])
                  if abs(value / 5.0 - round(value / 5.0)) > 1e-9:
                      raise SystemExit(f"Practical bound is not literal $5 rounding: {key}={value}")

          print("Phase 4D.2 validation passed.")
          print("Latest:", latest)
          print("Latest activity:", diag.get("latest_observed_activity_window"))
          print("Gates:", diag.get("prospective_gates"))
          print("Operational:", op)
          PY

      - name: Upload Phase 4D.2 diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: pionex-grid-actionability-v1
          path: |
            data/diagnostics/pionex_grid_actionability_v1.json
            data/diagnostics/pionex_grid_geometry_optimizer_v1.json
            data/diagnostics/pionex_grid_calibration_v2.json
            data/pionex/grid_activity_windows_v1.csv
          if-no-files-found: error

      - name: Persist Phase 4D.2 outputs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add \
            data/diagnostics/pionex_grid_actionability_v1.json \
            data/diagnostics/pionex_grid_geometry_optimizer_v1.json \
            data/diagnostics/pionex_grid_calibration_v2.json \
            data/pionex/grid_activity_windows_v1.csv

          git diff --cached --quiet && echo "No Phase 4D.2 output changes" && exit 0
          git commit -m "Phase 4D.2 grid activity and actionability [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
