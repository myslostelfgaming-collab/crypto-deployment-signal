name: Pionex Automated Phase 4.5 Decision CI

on:
  workflow_dispatch: {}
  schedule:
    # Full Phase 4.5 decision every 3 hours, aligned to 04:42 SAST then every 3h.
    # Cron is UTC. Raw API capture also runs hourly.
    - cron: "42 2,5,8,11,14,17,20,23 * * *"

permissions:
  contents: write

concurrency:
  group: phase4d-full-pionex-decision
  cancel-in-progress: false

jobs:
  automated-pionex-decision:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Capture a fresh read-only Pionex state
        env:
          PIONEX_API_KEY: ${{ secrets.PIONEX_API_KEY }}
          PIONEX_API_SECRET: ${{ secrets.PIONEX_API_SECRET }}
        run: python scripts/pull_pionex_grid_state_v1.py

      - name: Build canonical and runtime model-state histories
        run: |
          python scripts/build_pionex_model_state_v1.py
          test -s data/pionex/model_grid_states_v1.csv
          test -s data/pionex/runtime_grid_states_v1.csv
          test -s data/diagnostics/pionex_state_source_v1.json

      - name: Run Phase 4.5 against fresh API runtime state
        run: |
          cp data/pionex/manual_grid_states_v1.csv /tmp/manual_grid_states_v1.audit.csv
          cp data/pionex/runtime_grid_states_v1.csv data/pionex/manual_grid_states_v1.csv

          set +e
          python scripts/run_pionex_phase4_5_full_v1.py
          phase_status=$?
          set -e

          cp /tmp/manual_grid_states_v1.audit.csv data/pionex/manual_grid_states_v1.csv
          exit $phase_status

      - name: Validate immutable manual archive and full outputs
        run: |
          if ! git diff --quiet -- data/pionex/manual_grid_states_v1.csv; then
            echo "Safety invariant failed: manual screenshot archive was modified."
            git diff -- data/pionex/manual_grid_states_v1.csv
            exit 1
          fi

          test -s data/diagnostics/pionex_execution_resolution_v1.json
          test -s data/pionex/execution_resolution_policy_v1.json
          test -s data/pionex/execution_resolution_windows_v1.csv
          test -s data/pionex/execution_candles/ETH-USDT_5min.csv
          test -s data/diagnostics/pionex_grid_geometry_optimizer_v1.json
          test -s data/diagnostics/pionex_grid_calibration_v2.json
          test -s data/pionex/grid_geometry_recommendations_v1.csv
          test -s data/diagnostics/pionex_grid_actionability_v1.json
          test -s data/pionex/grid_activity_windows_v1.csv
          test -s data/diagnostics/pionex_grid_density_sweep_v1.json
          test -s data/diagnostics/pionex_joint_paired_geometry_v1.json
          test -s data/diagnostics/pionex_full_decision_v1.json

          python - <<'PY'
          import json
          from pathlib import Path

          source = json.loads(
              Path("data/diagnostics/pionex_state_source_v1.json").read_text(encoding="utf-8")
          )
          decision = json.loads(
              Path("data/diagnostics/pionex_full_decision_v1.json").read_text(encoding="utf-8")
          )
          joint = json.loads(
              Path("data/diagnostics/pionex_joint_paired_geometry_v1.json").read_text(encoding="utf-8")
          )

          if source.get("status") != "API_PRIMARY_UI_PARITY_CONFIRMED":
              raise SystemExit(f"Unexpected state-source status: {source.get('status')}")
          if decision.get("schema") != "pionex_full_decision_v1":
              raise SystemExit(f"Unexpected full-decision schema: {decision.get('schema')}")
          if joint.get("schema") != "pionex_joint_paired_geometry_v1":
              raise SystemExit(f"Unexpected Phase 4.5 schema: {joint.get('schema')}")
          if joint.get("version") != "4.5":
              raise SystemExit(f"Unexpected Phase 4.5 version: {joint.get('version')}")

          latest_source = source.get("latest_runtime_state") or {}
          decision_source = decision.get("source_state") or {}
          joint_source = joint.get("source_state") or {}

          expected_capture = latest_source.get("captured_at_utc")
          if expected_capture != decision_source.get("captured_at_utc"):
              raise SystemExit(
                  "Full decision did not consume latest API runtime state: "
                  f"{expected_capture} vs {decision_source.get('captured_at_utc')}"
              )
          if expected_capture != joint_source.get("captured_at_utc"):
              raise SystemExit(
                  "Phase 4.5 did not consume latest API runtime state: "
                  f"{expected_capture} vs {joint_source.get('captured_at_utc')}"
              )

          integrity = decision.get("pipeline_integrity") or {}
          if not integrity or not all(value is True for value in integrity.values()):
              raise SystemExit(f"Phase 4D pipeline integrity failed: {integrity}")

          phase45 = decision.get("phase4_5_joint_paired_geometry") or {}
          if not phase45:
              raise SystemExit("Phase 4.5 summary missing from full decision")
          if (
              (decision.get("paired_cycle_validation") or {})
              .get("phase4_5", {})
              .get("automatic_joint_promotion_allowed")
              is not False
          ):
              raise SystemExit("Safety invariant failed: automatic joint promotion enabled")

          practical = joint.get("practical_candidate_exact_recompute") or {}
          if practical and practical.get("lower_usdt") is not None:
              if practical.get("metrics_recomputed_for_rounded_bounds") is not True:
                  raise SystemExit(
                      "Practical Phase 4.5 candidate exists without exact metric recomputation"
                  )

          print("Automated API -> Phase 4.5 validation passed.")
          print("Latest source:", latest_source)
          print("Phase 4.5:", phase45.get("selection"))
          print("Operational:", decision.get("operational_decision"))
          PY

      - name: Write automated Phase 4.5 summary
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path

          source = json.loads(
              Path("data/diagnostics/pionex_state_source_v1.json").read_text(encoding="utf-8")
          )
          d = json.loads(
              Path("data/diagnostics/pionex_full_decision_v1.json").read_text(encoding="utf-8")
          )

          latest = source.get("latest_runtime_state") or {}
          execution = d.get("execution_resolution") or {}
          phase45 = d.get("phase4_5_joint_paired_geometry") or {}
          selection = phase45.get("selection") or {}
          chosen = selection.get("robust_joint_selection") or {}
          practical = phase45.get("practical_candidate_exact_recompute") or {}
          op = d.get("operational_decision") or {}

          lines = [
              "# Automated Pionex Phase 4.5 Decision",
              "",
              "**State source:** `Pionex read-only Bot API`",
              f"**Operational decision:** `{op.get('action')}`",
              f"**Actionable geometry change:** `{op.get('actionable_geometry_change')}`",
              "",
              "## Fresh live state",
              f"- Captured: `{latest.get('captured_at_local')}`",
              f"- Price: `${latest.get('current_price_usdt')}`",
              f"- Geometry: `${latest.get('lower_limit_usdt')}–${latest.get('upper_limit_usdt')}` / `{latest.get('grids')}` grids",
              f"- Derived 24h rounds: `{latest.get('rounds_24h')}`",
              "",
              "## Phase 4.5 paired joint research",
              f"- Execution replay: `{execution.get('active_execution_resolution')}`",
              f"- Selection status: `{selection.get('status')}`",
              f"- Research action: `{selection.get('research_action')}`",
              f"- Robust raw geometry: `${chosen.get('lower_usdt')}–${chosen.get('upper_usdt')}` / `{chosen.get('grids')}` grids",
              f"- Practical exact-recomputed geometry: `${practical.get('lower_usdt')}–${practical.get('upper_usdt')}` / `{practical.get('grids')}` grids",
              f"- Expected paired gain vs current: `{selection.get('expected_profit_gain_vs_current_pct')}%`",
              f"- Joint stability: `{(phase45.get('cross_run_stability') or {}).get('status')}`",
              f"- Promotion status: `{phase45.get('promotion_status')}`",
              "",
              f"- Blockers: `{op.get('blockers')}`",
          ]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("\n".join(lines) + "\n")
          PY

      - name: Upload automated Phase 4.5 bundle
        uses: actions/upload-artifact@v4
        with:
          name: pionex-automated-phase4-5-v1
          path: |
            data/pionex/api_bot_state_latest_v1.json
            data/pionex/api_grid_states_v1.csv
            data/diagnostics/pionex_api_parity_v1.json
            data/pionex/model_grid_states_v1.csv
            data/pionex/runtime_grid_states_v1.csv
            data/diagnostics/pionex_state_source_v1.json
            data/diagnostics/pionex_full_decision_v1.json
            data/diagnostics/pionex_execution_resolution_v1.json
            data/pionex/execution_resolution_policy_v1.json
            data/pionex/execution_resolution_windows_v1.csv
            data/pionex/execution_candles/ETH-USDT_5min.csv
            data/diagnostics/pionex_grid_geometry_optimizer_v1.json
            data/diagnostics/pionex_grid_calibration_v2.json
            data/pionex/grid_geometry_recommendations_v1.csv
            data/diagnostics/pionex_grid_actionability_v1.json
            data/pionex/grid_activity_windows_v1.csv
            data/diagnostics/pionex_grid_density_sweep_v1.json
            data/diagnostics/pionex_joint_paired_geometry_v1.json
          if-no-files-found: error

      - name: Persist API, state-model, Phase 4D and Phase 4.5 outputs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add \
            data/pionex/api_bot_state_latest_v1.json \
            data/pionex/api_grid_states_v1.csv \
            data/diagnostics/pionex_api_parity_v1.json \
            data/pionex/model_grid_states_v1.csv \
            data/pionex/runtime_grid_states_v1.csv \
            data/diagnostics/pionex_state_source_v1.json \
            data/diagnostics/pionex_full_decision_v1.json \
            data/diagnostics/pionex_execution_resolution_v1.json \
            data/pionex/execution_resolution_policy_v1.json \
            data/pionex/execution_resolution_windows_v1.csv \
            data/pionex/execution_candles/ETH-USDT_5min.csv \
            data/diagnostics/pionex_grid_geometry_optimizer_v1.json \
            data/diagnostics/pionex_grid_calibration_v2.json \
            data/pionex/grid_geometry_recommendations_v1.csv \
            data/diagnostics/pionex_grid_actionability_v1.json \
            data/pionex/grid_activity_windows_v1.csv \
            data/diagnostics/pionex_grid_density_sweep_v1.json \
            data/diagnostics/pionex_joint_paired_geometry_v1.json

          if ! git diff --quiet; then
            echo "Unexpected unstaged tracked changes remain:"
            git status --short
            exit 1
          fi

          git diff --cached --quiet && echo "No automated Pionex changes" && exit 0
          git commit -m "Automated Pionex Phase 4.5 joint decision [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
