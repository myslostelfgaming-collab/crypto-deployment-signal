name: Apply Pionex Calibration v2 Upgrade

on:
  push:
    branches:
      - feat/pionex-calibration-v2
    paths:
      - ".calibration-upgrade/READY"

permissions:
  contents: write

jobs:
  apply-upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Decode tested upgrade bundle
        run: |
          rm -rf /tmp/pionex-calibration-v2
          mkdir -p /tmp/pionex-calibration-v2
          cat .calibration-upgrade/part*.b64 | base64 -d > /tmp/pionex-calibration-v2.zip
          unzip -q /tmp/pionex-calibration-v2.zip -d /tmp/pionex-calibration-v2
          mkdir -p tests

          cp /tmp/pionex-calibration-v2/scripts/pionex_calibration_quality_v2.py scripts/
          cp /tmp/pionex-calibration-v2/scripts/replay_pionex_calibration_v2.py scripts/
          cp /tmp/pionex-calibration-v2/scripts/build_pionex_calibration_quality_v2.py scripts/
          cp /tmp/pionex-calibration-v2/scripts/run_pionex_phase4_6_full_v1.py scripts/
          cp /tmp/pionex-calibration-v2/tests/test_pionex_calibration_quality_v2.py tests/
          cp /tmp/pionex-calibration-v2/README_PIONEX_CALIBRATION_V2_UPGRADE.md ./

      - name: Integrate calibration v2 into automated Phase 4 workflow
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path(".github/workflows/pionex-automated-phase4d-ci.yml")
          s = p.read_text(encoding="utf-8")

          s = s.replace(
              "name: Pionex Automated Phase 4.5 Decision CI",
              "name: Pionex Automated Phase 4.6 Calibration Decision CI",
          )
          s = s.replace(
              "Run Phase 4.5 against fresh API runtime state",
              "Run Phase 4.6 against fresh API runtime state",
          )
          s = s.replace(
              "python scripts/run_pionex_phase4_5_full_v1.py",
              "python scripts/run_pionex_phase4_6_full_v1.py",
          )

          install_block = '''      - name: Install Python dependencies
                  run: |
                    python -m pip install --upgrade pip
                    pip install -r requirements.txt
          '''
          # Do not rely on exact indentation formatting for this insertion.
          marker = '      - name: Capture a fresh read-only Pionex state\n'
          test_step = '''      - name: Run calibration-v2 unit tests
                  run: python -m unittest discover -s tests -p 'test_pionex_calibration_quality_v2.py' -v

          '''
          if "Run calibration-v2 unit tests" not in s:
              s = s.replace(marker, test_step + marker, 1)

          old = "          test -s data/diagnostics/pionex_grid_calibration_v2.json\n"
          new = old + "          test -s data/diagnostics/pionex_calibration_quality_v2.json\n"
          if "test -s data/diagnostics/pionex_calibration_quality_v2.json" not in s:
              s = s.replace(old, new, 1)

          load_marker = '''          joint = json.loads(
                        Path("data/diagnostics/pionex_joint_paired_geometry_v1.json").read_text(encoding="utf-8")
                    )
          '''
          cal_load = '''          calv2 = json.loads(
                        Path("data/diagnostics/pionex_calibration_quality_v2.json").read_text(encoding="utf-8")
                    )
          '''
          if 'Path("data/diagnostics/pionex_calibration_quality_v2.json").read_text' not in s:
              s = s.replace(load_marker, load_marker + cal_load, 1)

          version_marker = '''          if joint.get("version") != "4.5":
                        raise SystemExit(f"Unexpected Phase 4.5 version: {joint.get('version')}")
          '''
          checks = '''          if calv2.get("schema") != "pionex_paired_cycle_calibration_v2":
                        raise SystemExit(f"Unexpected calibration-v2 schema: {calv2.get('schema')}")
                    if calv2.get("primary_percentage_metric") != "WAPE":
                        raise SystemExit("Calibration v2 must use WAPE as the primary percentage metric")
                    if calv2.get("secondary_percentage_metric") != "GUARDED_MAPE_NORMAL_ACTIVITY_ONLY":
                        raise SystemExit("Calibration v2 guarded MAPE policy missing")
                    if not (decision.get("forecast_calibration_confidence") or {}):
                        raise SystemExit("Calibration-v2 forecast confidence missing from full decision")
          '''
          if 'Unexpected calibration-v2 schema' not in s:
              s = s.replace(version_marker, version_marker + checks, 1)

          artifact_marker = "            data/diagnostics/pionex_grid_calibration_v2.json\n            data/pionex/grid_geometry_recommendations_v1.csv\n"
          artifact_new = "            data/diagnostics/pionex_grid_calibration_v2.json\n            data/diagnostics/pionex_calibration_quality_v2.json\n            data/pionex/grid_geometry_recommendations_v1.csv\n"
          if "            data/diagnostics/pionex_calibration_quality_v2.json\n" not in s:
              s = s.replace(artifact_marker, artifact_new, 1)

          commit_marker = "            data/diagnostics/pionex_grid_calibration_v2.json \\\n            data/pionex/grid_geometry_recommendations_v1.csv \\\n"
          commit_new = "            data/diagnostics/pionex_grid_calibration_v2.json \\\n            data/diagnostics/pionex_calibration_quality_v2.json \\\n            data/pionex/grid_geometry_recommendations_v1.csv \\\n"
          if "            data/diagnostics/pionex_calibration_quality_v2.json \\\n" not in s:
              s = s.replace(commit_marker, commit_new, 1)

          p.write_text(s, encoding="utf-8")
          PY

      - name: Run calibration tests and historical replay
        run: |
          python -m unittest discover -s tests -p 'test_pionex_calibration_quality_v2.py' -v
          python scripts/replay_pionex_calibration_v2.py
          test -s data/diagnostics/pionex_calibration_quality_v2.json

      - name: Verify live-bot safety invariant remains research-only
        run: |
          python - <<'PY'
          from pathlib import Path
          runner = Path("scripts/run_pionex_phase4_6_full_v1.py").read_text(encoding="utf-8")
          p45 = Path("scripts/run_pionex_phase4_5_full_v1.py").read_text(encoding="utf-8")
          if "phase45.main()" not in runner or "calv2.main()" not in runner:
              raise SystemExit("Phase 4.6 wrapper is incomplete")
          if '"automatic_joint_promotion_allowed": False' not in p45:
              raise SystemExit("Phase 4.5 no-auto-promotion invariant missing")
          print("Research-only safety invariant confirmed.")
          PY

      - name: Commit applied upgrade to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/pionex_calibration_quality_v2.py \
            scripts/replay_pionex_calibration_v2.py \
            scripts/build_pionex_calibration_quality_v2.py \
            scripts/run_pionex_phase4_6_full_v1.py \
            tests/test_pionex_calibration_quality_v2.py \
            README_PIONEX_CALIBRATION_V2_UPGRADE.md \
            .github/workflows/pionex-automated-phase4d-ci.yml \
            data/diagnostics/pionex_calibration_quality_v2.json

          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "Add Pionex calibration v2 evidence and confidence"
          git push origin HEAD:feat/pionex-calibration-v2
